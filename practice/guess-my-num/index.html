<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess My Number</title>
    <link href="../guess-my-num/style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Press+Start+2P&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <button class="again-button">Again!</button>
      <p class="paragraph-text">(Between 1 and 20)</p>
    </header>
    <section>
      <div>
        <p class="guess-my-num">Guess my Number!</p>
        <div class="border">
            <p class="number-check">?</p>
        </div>

      <div class="section-main">
        <div>
          <input type="number" class="input-main" /><br />
          <button class="again-button">check!</button>
        </div>
        <div>
          <p class="paragraph-text mb-48">Start guessing....</p>
          <p class="paragraph-text mb-24">💯 Score :20</p>
          <p class="paragraph-text mb-24">🥇 Highscore: 0</p>
        </div>
      </div>
    </section>
  </body>
</html>
